name: Release PDF

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm

      - name: Install Poppler
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches package version
        run: |
          package_version=$(node -p "require('./package.json').version")
          test "v${package_version}" = "${GITHUB_REF_NAME}"

      - name: Build PDF
        run: pnpm build

      - name: Publish PDF release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pdf_path="output/react-pdf-ai-builders-guide.pdf"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$pdf_path" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$pdf_path" \
              --verify-tag \
              --generate-notes \
              --title "$GITHUB_REF_NAME"
          fi
